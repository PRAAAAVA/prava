<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قوانين مدينة كراون</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0d0d0d;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* الحاوية الرئيسية المركزية */
    .container {
      background-color: #161616;
      border: 1px solid #282828;
      border-radius: 12px;
      width: 100%;
      max-width: 800px;
      padding: 35px 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    /* العنوان الرئيسي */
    .title {
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 25px;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    /* خط الفاصل */
    .divider {
      border: none;
      height: 1px;
      background-color: #2a2a2a;
      margin-bottom: 25px;
    }

    /* شبكة الأزرار */
    .buttons-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 30px;
    }

    /* تصميم البطاقة/الزر */
    .rule-card {
      background-color: #1c1c1c;
      border: 1px solid #333333;
      border-radius: 8px;
      padding: 18px 10px;
      color: #ffffff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease-in-out;
      cursor: pointer;
    }

    /* تأثير الهوفر عند مرور الماوس */
    .rule-card:hover {
      background-color: #252525;
      border-color: #555555;
      transform: translateY(-2px);
    }

    .star-icon {
      font-size: 11px;
      color: #ffffff;
    }

    /* الحقوق المكتوبة بالأسفل */
    .footer-text {
      color: #555555;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    /* التجاوب مع الشاشات الصغيرة (الجوال) */
    @media (max-width: 768px) {
      .buttons-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="title">👑 قوانين مدينة كراون 👑</h1>
    
    <hr class="divider">

    <div class="buttons-grid">
      <a href="#" class="rule-card">
        <span class="star-icon">✦</span>
        قوانين المدينة
        <span class="star-icon">✦</span>
      </a>

      <a href="#" class="rule-card">
        <span class="star-icon">✦</span>
        قوانين المنظمات والعصابات
        <span class="star-icon">✦</span>
      </a>

      <a href="#" class="rule-card">
        <span class="star-icon">✦</span>
        قوانين الديسكورد
        <span class="star-icon">✦</span>
      </a>

      <a href="#" class="rule-card">
        <span class="star-icon">✦</span>
        قوانين الوزارات
        <span class="star-icon">✦</span>
      </a>

      <a href="#" class="rule-card">
        <span class="star-icon">✦</span>
        قوانين الهروب الأمني
        <span class="star-icon">✦</span>
      </a>
    </div>

    <div class="footer-text">
      PRAVA RP
    </div>
  </div>

</body>
</html>
